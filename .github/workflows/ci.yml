name: CI — Lint, Type Check & Build

on:
  pull_request:
    branches:
      - main
      - release
      - develop
  push:
    branches:
      - develop
      - release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript compiler check
        run: yarn tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify]

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_USER_POOL_ID: dummy_user_pool_id
      NEXT_PUBLIC_USER_POOL_CLIENT_ID: dummy_user_pool_client_id
      NEXT_PUBLIC_CLIENT_ID: dummy_client_id
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js application
        run: yarn build
